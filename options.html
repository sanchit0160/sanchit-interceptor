<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sanchit Interceptor — Options</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1218;
    color: #eef2f7;
    font-size: 14px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 24px; color: #f59e0b; }
  .panel {
    background: #141820;
    border: 1px solid #222836;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 12px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: #6f7b8e;
    margin: 0 0 16px;
  }
  .row { margin-bottom: 16px; }
  .row:last-child { margin-bottom: 0; }
  .row label {
    display: block; font-size: 12.5px; font-weight: 600;
    margin-bottom: 6px; color: #a8b3c4;
  }
  .row .sub { font-size: 11.5px; color: #6f7b8e; margin-top: 6px; line-height: 1.5; }
  input[type="number"] {
    width: 100%; height: 38px; padding: 0 12px;
    font-size: 13.5px; color: #eef2f7; background: #1b2029;
    border: 1px solid #2c3342; border-radius: 8px; outline: none;
    font-family: inherit;
  }
  input:focus { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,.25); }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  button {
    height: 36px; padding: 0 16px; border-radius: 8px;
    font-size: 13px; font-weight: 500; border: 1px solid transparent;
    cursor: pointer;
  }
  .btn-primary { background: #f59e0b; color: #000; font-weight: 600; }
  .btn-primary:hover { background: #fbbf24; }
  .btn-secondary { background: #1b2029; color: #eef2f7; border-color: #2c3342; }
  .btn-secondary:hover { background: #222834; }
  .saved {
    display: inline-block; margin-left: 12px;
    color: #10b981; font-size: 12.5px;
    opacity: 0; transition: opacity .2s;
  }
  .saved.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sanchit Interceptor — Options</h1>

  <div class="panel">
    <h2>Storage</h2>
    <div class="row">
      <label for="maxEntries">Max stored requests</label>
      <input type="number" id="maxEntries" min="100" max="100000" step="100" value="5000">
      <div class="sub">Older requests are deleted when the cap is reached. Default: 5000.</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-secondary" id="resetBtn">Reset to defaults</button>
    <button class="btn-primary" id="saveBtn">Save</button>
    <span class="saved" id="savedMsg">Saved</span>
  </div>

  <footer style="margin-top:30px; text-align:center; font-size:11px; color:#6f7b8e;">
    Sanchit Interceptor v1.0.0 · Copyright &copy; 2026 Sanchit. All rights reserved.
  </footer>
</div>
<script src="options.js" type="module"></script>
</body>
</html>
